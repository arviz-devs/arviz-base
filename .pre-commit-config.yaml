repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-toml
  - id: check-merge-conflict
  - id: end-of-file-fixer
  - id: no-commit-to-branch
    args: [--branch, main]
  - id: trailing-whitespace

- repo: local
  hooks:
    - id: docstub
      name: Generate stub files
      entry: docstub run src/arviz_base
      language: system
      types: [python]
      pass_filenames: false
      stages: [manual]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: '41e691678310dfd3833f7ab4e180ddb014310356'  # frozen: v2.3.0
  hooks:
    - id: mypy
      name: Check static typing
      entry: mypy src tests
      pass_filenames: false

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06  # frozen: v0.15.21
  hooks:
    - id: ruff-check
      args: [--fix, --exit-non-zero-on-fix]
      types: [ python ]
    - id: ruff-format
      types: [ python ]

- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 543b5e414406c00edeb9e2204141713c4c8d2404  # frozen: 0.4.1
  hooks:
    - id: no-print-statements

- repo: local
  hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: system
      types: [python]
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
        ]
